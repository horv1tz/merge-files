name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/merge-files.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath merge-files-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: merge-files-windows-x64
          path: |
            merge-files-windows-x64.zip
            target/release/merge-files.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: merge-files-windows-x64.zip
