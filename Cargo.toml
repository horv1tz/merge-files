[package]
name = "merge-files"
version = "0.1.0"
edition = "2024"
description = "Объединяет листы Excel или документы Word в один файл или PDF"
license = "MIT"
rust-version = "1.85"
publish = false

[dependencies]
anyhow = "1.0.104"
calamine = "0.37.0"
eframe = "0.37.0"
rfd = "0.17.2"
tempfile = "3.27.0"
zip = "9.0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
